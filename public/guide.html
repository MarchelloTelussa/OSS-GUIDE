<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuidePage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --black : rgb(0, 0, 0);
            --white : rgb(255, 255, 255);
            --snowwhite : rgb(251, 251, 251);
            --lightgrey : rgb(200, 206, 214);
            --grey : rgb(108, 117, 125);
            --darkgrey : rgb(71, 85, 105);
            --blue : rgb(0, 123, 255);
            --bg : rgb(248, 249, 250);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; flex-direction: column; min-height: 100vh; font-family: Arial, sans-serif; background-color: var(--bg); overflow: hidden; }

        nav { position: fixed; top: 0; left: 0; display: flex; justify-content: flex-end; align-items: center; width: 100%; height: 45px; padding: 0 1rem; border-bottom: 2px solid var(--lightgrey); background-color: var(--white); z-index: 30; }
        nav .nav_profile { display: flex; gap: 15px; list-style: none; }
        nav .nav_profile a { text-decoration: none; color: var(--black); font-size: 1.1rem; }

        main { width: 100vw; height: calc(100vh - 45px); margin-top: 45px; position: relative; }
        .guide-wrapper { width: 100%; height: 100%; position: relative; }

        .guide-header { position: fixed; top: 45px; left: 0; width: 100%; height: 60px; display: flex; justify-content: space-between; align-items: center; background: var(--blue); backdrop-filter: blur(8px); padding: 0 2rem; z-index: 20; }
        .guide-title { color: var(--white); }
        .guide-button { display: flex; gap: 1.5rem; align-items: center; }
        .btn-edit a, .btn-back a { color: var(--white); text-decoration: none; font-size: 1.2rem; }

        .btn-view button, .btn-delete button { background: transparent; border: none; color: var(--white); font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; }

        .guide-video { position: absolute; top: 60px; left: 0; width: 100vw; height: calc(100vh - 105px); display: flex; justify-content: center; align-items: center; background-color: var(--black); }

        .guide-video video { width: 100%; height: 100%; object-fit: contain; }


        .guide-info { position: fixed; top: 0; right: 0; width: 380px; max-width: 85vw; height: 100vh; background: rgba(0, 123, 255, 0.5); backdrop-filter: blur(15px); border-left: 1px solid var(--white); color: white; padding: 50px 30px 30px 30px; z-index: 100; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        
        .guide-info.open { transform: translateX(0); }

        .close-btn { position: absolute; top: 15px; right: 20px; background: transparent; border: none; color: var(--lightgrey); font-size: 2rem; cursor: pointer; }
        .close-btn:hover { color: var(--white); }

        .guide-desc, .guide-note, .guide-steps { margin-bottom: 20px; }
        .guide-steps ol { padding-left: 20px; margin-top: 10px; }
        .guide-steps li { margin-bottom: 8px; line-height: 1.4; }

        /* Backdrop Overlay */
        .backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); opacity: 0; visibility: hidden; transition: opacity 0.3s; z-index: 90; }
        .backdrop.active { opacity: 1; visibility: visible; }

        /* Modal Delete Overlay */
        .backdrop.confirmdel { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.2s ease-in-out; opacity: 1; visibility: visible; }

        .confirm_delete_box { background-color: #ffffff; width: 90%; max-width: 420px; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); text-align: center; animation: scaleUp 0.2s ease-in-out; }

        .confirm_delete_header h3 { margin-top: 0; margin-bottom: 12px; font-size: 1.25rem; color: #1e293b; }

        .confirm_delete_header p { margin-bottom: 24px; font-size: 0.95rem; color: #64748b; line-height: 1.5; }

        .confirm_delete_header b { color: #0f172a; }

        .button_group { display: flex; justify-content: flex-end; gap: 12px; }

        .button_delete,
        .button_cancel { padding: 10px 18px; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }

        .button_delete { background-color: #ef4444; color: #ffffff; }

        .button_delete:hover { background-color: #dc2626; }

        .button_cancel { background-color: #f1f5f9; color: #475569; }

        .button_cancel:hover { background-color: #e2e8f0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>

<body>
    <nav>
        <ul class="nav_profile">
            <li>
                <a href="index.html">
                    <i class="fa-regular fa-circle-question"></i>
                </a>
            </li>
            <li>
                <a href="#" id="navUser">
                    <i class="fa-regular fa-circle-user"></i>
                </a>
            </li>
            <li>
                <a href="#" id="fullscreenBtn">
                    <i class="fa-solid fa-maximize"></i>
                </a>
            </li>
        </ul>
    </nav>

    <main id="guide-container">
    </main>

    <script type="module" src="./js/guide.js"></script>
    <script type="module" src="./js/nav-auth.js"></script>
</body>
</html>
