<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuidePage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
        --outline : rgb(200, 206, 214);
        --text1 : rgb(71, 85, 105);
        --text2 : rgb(108, 117, 125);
        --main : rgb(5, 3, 102);
        --main2 : rgb(7, 5, 113);
        --second : rgb(3, 0, 151);
        --second2 : rgb(250, 250, 250); 
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Arimo";}
    html, body { height: 100vh; margin: 0; overflow: hidden; }
    .fa, .fas, .far, .fab { border-radius: 0px !important; }
    .navContainer {top: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 100%; padding: 0 1rem; min-height: 2.75rem;background-color: var(--main);}
    .appName {color: white; font-weight: bold; font-size: 1.2rem;}
    .navAction {list-style-type: none; list-style: none; margin: 0; padding: 0; display: flex; gap: 0.8rem;}
    .navAction a {text-decoration: none; color: white; font-size: 1.2rem; font-weight: 500;}
    .navAction a:hover {color: var(--outline);}

    .dashboardHeader {display: flex; flex-direction: row; align-items: flex-end; margin: 1.5rem 5rem 0; width: 100%; max-height: 5rem;}
    .logoHeader { width: 3.5rem; height: 3.5rem; flex-shrink: 0; object-fit: contain;}
    .pageName {color: var(--main); font-size: 4rem; margin: 0 0 -0.75rem 0.5rem; padding: 0;}
    .searchContainer {display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; max-width: 40rem; height: 100%; max-height: 3rem; padding: 1rem 1rem; border-radius: 10px; border: 1px solid black; box-sizing: border-box; margin: 0 0 0 2.5rem}
    .searchContainer input {flex: 1; border: none; outline: none; font-size: 1.2rem; background: transparent; width: 100%;}
    .searchContainer button {width: auto; border: none; background-color: transparent; font-size: 2rem;}
    .searchContainer button:hover {cursor: pointer; color: var(--second);}

    .dashboardMain {height: 100vh; overflow: hidden; margin: 0.25rem 5rem 0; border: 1px solid black;}
    .content {display: flex; flex-direction: column; height: 100%;}
    .typeContainer {display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 2rem 0 0; width: 100%; height: 100%; max-height: 2.5rem; min-height: 2.5rem; background-color: var(--main);}
    .typeGroup {display:flex; flex-direction: row; width: 45%; height: 100%;}
    .typeButton {display: flex; align-items: center; justify-content: center; width: 9rem; height: 100%;}
    .typeButton.active {background-color: var(--second);}
    .typeButton h1 {color: white; font-size: 1.5rem;}

    .buttonGroup {display: flex; flex-direction: row; gap: 30px;}
    .backButton button, .viewButton button, .editButton button, .deleteButton button {color: white; background: none; border: none; cursor: pointer; font-size: 1.25rem;}
    .backButton button:hover, .viewButton button:hover, .editButton button:hover, .deleteButton button:hover {color: var(--outline)}

    .guideCardContainer { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: max-content; gap: 15px; width: 100%; flex: 1; overflow-y: auto; padding: 15px 8px 40px 8px; box-sizing: border-box; background-color: var(--bg); -webkit-overflow-scrolling: touch; }
    .guideCardContainer::-webkit-scrollbar { width: 6px; }
    .guideCardContainer::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .guideCardContainer::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    .guideCardContainer::-webkit-scrollbar-thumb:hover { background: #888; }

    .guideCard { display: flex; justify-content: space-between; width: 100%; min-height: 80px; padding: 1rem; text-decoration: none; border-radius: 15px; color: black; border: 2px solid black; box-sizing: border-box; transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out; }
    .guideCard h2 { margin: 0; font-size: 1.8rem; }
    .guideCard p { margin: 5px 0 0 0; color: var(--grey); font-size: 1rem; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
    .guideCard:hover { transform: translateY(-3px); box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15); }

    .detailHeader {display: flex; flex-direction: row; justify-content: space-between; align-items: center; max-height: 4rem; padding: 0 1rem; height: 100%; width: 100%;  background-color: var(--main2);}
    .detailHeader h1 {color: white;}
    .buttonGroup {color: white;}
    .detailMain {width: 100vw; height: calc(100vh - 6.75rem); position: relative; background-color: black;}
    .detailMain video {width: 100%; height: 100%; object-fit: contain;}

    .backdrop {position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); opacity: 0; visibility: hidden; transition: opacity 0.3s; z-index: 90; filter: blur(20px);}
    .backdrop.active { opacity: 1; visibility: visible; }
    </style>
</head>

<body>
    <nav class="navContainer"> 
        <div class="appName">
            <h3>QUANTUM GUIDE</h3>
        </div>
        <ul class="navAction">
            <li>
                <a href="index.html">
                    <i class="fa-regular fa-circle-question"></i>
                </a>
            </li>
            <li>
                <a href="#" id="user">
                    <i class="fa-regular fa-circle-user"></i>
                </a>
            </li>
            <li>
                <a href="#" id="fullscreen">
                    <i class="fa-solid fa-maximize"></i>
                </a>
            </li>
        </ul>
    </nav>
    <header class="dashboardHeader">
        <img class="logoHeader" src="./img/logo.png" alt="">
        <h1 class="pageName">DASHBOARD</h1>
        <div class="searchContainer">
            <input id="searchBar" type="text">
            <button id="searchBtn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>
    <main class="dashboardMain">
        <div class="content">
            <div class="typeContainer">
                    <div id ="types" class="typeGroup">
                        <div class="typeButton active">
                            <h1>OSS WEB</h1>
                        </div>
                    </div>
                <div class="buttonGroup">
                    <div id="btnBack" class="backButton">
                        <button title="Back"><i class="fa-solid fa-arrow-left"></i></button>
                    </div>
                    <div id="btnAddGuide" class="addGuideButton">
                        <button title="Add Guide"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
            </div>
            <div class="guideCardContainer">
                <a href="" class="guideCard">
                    <div>
                        <h2>Test</h2>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laudantium culpa dolores dolor. Laudantium distinctio soluta, odit quasi sit aperiam officiis optio qui illum quae numquam doloribus ab, aliquid, voluptatem voluptatibus.</p>
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </div>
    </main>
    <script type="module" src="./js/guide.js"></script>
    <script type="module" src="./js/nav-auth.js"></script>
</body>
</html>
