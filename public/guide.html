<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --outline: rgb(200, 206, 214);
            --text1: rgb(71, 85, 105);
            --text2: rgb(108, 117, 125);
            --main: rgb(5, 3, 102);
            --main2: rgb(7, 5, 113);
            --second: rgb(3, 0, 151);
            --second2: rgb(250, 250, 250); 
            --danger: rgb(220, 53, 69);
            --cancel: rgb(108, 117, 125);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Arimo";}
        html, body { height: 100vh; margin: 0; overflow: hidden; }
        .fa, .fas, .far, .fab { border-radius: 0px !important; }
        
        .navContainer { top: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 100%; padding: 0 1rem; min-height: 2.75rem; background-color: var(--main); }
        .appName {display: flex; flex-direction: row; align-items: end; color: white; font-weight: bold; font-size: 1.2rem;}
        .navAction { list-style: none; margin: 0; padding: 0; display: flex; gap: 0.8rem; }
        .navAction a { text-decoration: none; color: white; font-size: 1.2rem; font-weight: 500; }
        .navAction a:hover { color: var(--outline); }

        .dashboardHeader { display: flex; flex-direction: row; align-items: flex-end; margin: 1.5rem 5rem 0; width: 100%; max-height: 5rem; }
        .logoHeader { width: 2rem; aspect-ratio: 1 / 1; flex-shrink: 0; object-fit: contain;}
        .pageName { color: var(--main); font-size: 4rem; margin: 0 0 -0.75rem 0.5rem; padding: 0; }
        .searchContainer { display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; max-width: 40rem; height: 100%; max-height: 3rem; padding: 1rem 1rem; border-radius: 10px; border: 1px solid black; box-sizing: border-box; margin: 0 0 0 2.5rem; }
        .searchContainer input { flex: 1; border: none; outline: none; font-size: 1.2rem; background: transparent; width: 100%; }
        .searchContainer button { width: auto; border: none; background-color: transparent; font-size: 2rem; }
        .searchContainer button:hover { cursor: pointer; color: var(--second); }

        .dashboardMain { height: calc(100vh - 9.5rem); overflow: hidden; margin: 0.25rem 5rem 0; border: 1px solid black; }
        .content { display: flex; flex-direction: column; height: 100%; }
        .typeContainer { display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 2rem 0 0; width: 100%; height: 2.5rem; background-color: var(--main); }
        .typeGroup { display: flex; flex-direction: row; width: 45%; height: 100%; }
        .typeButton { display: flex; align-items: center; justify-content: center; padding: 0 1rem; height: 100%; background-color: var(--second); }
        .typeButton h1 { color: white; font-size: 1.2rem; }

        .buttonGroup { display: flex; flex-direction: row; gap: 20px; align-items: center; }
        .buttonGroup button { color: white; background: none; border: none; cursor: pointer; font-size: 1.25rem; }
        .buttonGroup button:hover { color: var(--outline); }

        .guideCardContainer { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: max-content; gap: 15px; width: 100%; flex: 1; overflow-y: auto; padding: 15px; box-sizing: border-box; background-color: var(--second2); }
        .guideCard { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; min-height: 90px; padding: 1rem; text-decoration: none; border-radius: 12px; color: black; border: 1px solid var(--outline); background-color: white; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .guideCard h2 { margin: 0; font-size: 1.3rem; color: var(--main); }
        .guideCard p { margin: 5px 0 0 0; color: var(--text2); font-size: 0.95rem; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
        .guideCard:hover { transform: translateY(-3px); box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1); }

        /* Detail Mode Styles */
        .detailHeader { display: flex; flex-direction: row; justify-content: space-between; align-items: center; height: 3.5rem; padding: 0 2rem; width: 100%; background-color: var(--main2); }
        .detailHeader h1 { color: white; font-size: 1.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .detailMain { width: 100vw; height: calc(100vh - 6.25rem); position: relative; background-color: black; }
        .detailMain video { width: 100%; height: 100%; object-fit: contain; }

        /* Overlay Drawer (Kanan) */
        .backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); opacity: 0; visibility: hidden; transition: opacity 0.3s ease; z-index: 90; }
        .backdrop.active { opacity: 1; visibility: visible; }

        .detailOverlay { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background-color: var(--main); color: white; padding: 2rem 1.5rem; box-sizing: border-box; transition: right 0.3s ease; z-index: 100; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .detailOverlay.active { right: 0; }
        .detailOverlay .closeBtn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; }
        .detailOverlay .closeBtn:hover { color: var(--outline); }
        .detailOverlay p { line-height: 1.5; font-size: 1rem; text-align: justify; }
        .detailOverlay .noteBox { background-color: rgba(255, 255, 255, 0.1); padding: 1rem; border-left: 4px solid var(--outline); border-radius: 4px; }
        .detailOverlay ol { padding-left: 1.2rem; }
        .detailOverlay li { margin-bottom: 0.5rem; line-height: 1.4; }

        /* Modal Overlay Add/Edit Guide Modal */
        .guideModal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); width: 90%; max-width: 900px; background: white; border-radius: 8px; padding: 2.5rem 2rem 2rem 2rem; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s ease; max-height: 90vh; overflow-y: hidden; }
        .guideModal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .guideModal h2 { text-align: center; color: var(--main); font-size: 2.2rem; margin-bottom: 1.5rem; font-weight: bold; }
        .guideFormGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .guideFormLeft, .guideFormRight { display: flex; flex-direction: column; gap: 1.2rem; }
        .formGroup { display: flex; flex-direction: column; gap: 0.4rem; }
        .formGroup label { font-weight: bold; color: var(--text1); font-size: 0.95rem; }
        .formGroup input[type="text"], .formGroup textarea, .formGroup input[type="file"] { width: 100%; padding: 0.75rem; border: 1px solid var(--outline); border-radius: 4px; font-size: 1rem; outline: none; }
        .formGroup textarea { resize: vertical; min-height: 110px; }
        .stepsContainer { display: flex; flex-direction: column; gap: 0.6rem; max-height: 320px; min-height: 320px; overflow-y: auto; background-color: #f5f5f5; padding: 1rem; border-radius: 4px; }
        .stepItem { display: flex; gap: 0.5rem; align-items: center; }
        .stepItem input { flex: 1; padding: 0.6rem; border: 1px solid var(--outline); border-radius: 4px; font-size: 1rem; }
        .stepItem .btnRemoveStep { background-color: var(--danger); color: white; border: none; padding: 0.6rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 1.1rem; }
        .btnAddStep { background-color: var(--main); color: white; border: none; padding: 0.75rem; border-radius: 4px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background-color 0.2s; margin-top: 0.5rem; }
        .modalActions { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; }
        .modalActions button { padding: 0.75rem 2rem; font-size: 1.1rem; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        .modalActions .btnSubmitGuide { background-color: var(--main); color: white; }
        .modalActions .btnCancelGuide { background-color: var(--cancel); color: white; }
        .contentOverlay {display: flex; flex-direction: column; gap: 20px; margin-top: 20px;}

        @media screen and (max-width: 1200px) { .dashboardHeader { margin: 1.25rem 2rem 0; } .dashboardMain { margin: 0.25rem 2rem 0; } }
        @media screen and (max-width: 992px) { .pageName { font-size: 3rem; margin: 0 0 -0.5rem 0.5rem; } .searchContainer { max-width: 100%; margin-left: 0; } .guideCardContainer { grid-template-columns: repeat(2, 1fr); } .guideFormGrid { grid-template-columns: 1fr; gap: 1rem; } .detailOverlay { width: 320px; right: -340px; } }
        @media screen and (max-width: 768px) { html, body { overflow-y: auto; } .dashboardHeader { flex-direction: column; align-items: flex-start; max-height: none; margin: 1rem; width: calc(100% - 2rem); gap: 0.75rem; } .logoHeader { width: 3rem; height: 3rem; } .pageName { font-size: 2.25rem; margin: 0 0 0 0.5rem; } .searchContainer { width: 100%; max-width: 100%; margin: 0; height: 3rem; box-sizing: border-box; } .dashboardMain { height: auto; margin: 0.5rem 1rem 1rem; overflow: visible; } .typeContainer { padding: 0 0.5rem; height: 2.75rem; flex-direction: row; align-items: center; justify-content: space-between; gap: 0.5rem; overflow: hidden; } .typeGroup { display: flex; flex-direction: row; align-items: center; flex: 1; overflow-x: auto; overflow-y: hidden; white-space: nowrap; height: 100%; gap: 0.25rem; -webkit-overflow-scrolling: touch; } .typeButton { flex: 0 0 auto; width: auto; max-width: max-content; display: inline-flex; align-items: center; justify-content: center; padding: 0 1rem; height: 100%; box-sizing: border-box; } .buttonGroup { flex: 0 0 auto; } .guideCardContainer { grid-template-columns: 1fr; gap: 10px; padding: 10px; } .guideCard { width: 100%; min-height: 80px; height: auto; } .detailHeader { padding: 0 1rem; height: 3rem; } .detailHeader h1 { font-size: 1.1rem; } .detailMain { height: calc(100vh - 5.75rem); width: 100%; } .detailOverlay { width: 100vw; right: -100vw; } .guideModal { width: 95%; padding: 1.5rem 1rem; max-height: 95vh; } .guideModal h2 { font-size: 1.5rem; } .modalActions { flex-direction: column; gap: 0.5rem; } .modalActions button { width: 100%; } }
        @media screen and (max-width: 480px) { .appName { font-size: 1rem; } .navAction { gap: 0.5rem; } .guideCardContainer { grid-template-columns: 1fr; padding: 8px; } .guideCard { min-height: 75px; padding: 0.75rem; width: 100%; } .guideCard h2 { font-size: 1.1rem; } }
    </style>
</head>

<body>
    <nav class="navContainer"> 
        <div class="appName">
            <img class="logoHeader" src="./img/logo.png" alt="Logo">
            <h3>QUANTUM GUIDE</h3>
        </div>
        <ul class="navAction">
            <li><a href="index.html"><i class="fa-regular fa-circle-question"></i></a></li>
            <li><a href="#" id="user"><i class="fa-regular fa-circle-user"></i></a></li>
            <li><a href="#" id="fullscreen"><i class="fa-solid fa-maximize"></i></a></li>
        </ul>
    </nav>

    <!-- Container Utama untuk Mode List / Mode Video Detail -->
    <div id="viewContainer"></div>

    <!-- Overlay Drawer Sidebar (Kanan) -->
    <div id="backdrop" class="backdrop"></div>
    <aside id="detailOverlay" class="detailOverlay">
        <button id="closeOverlay" class="closeBtn">&times;</button>
        <div id="overlayContent" class="contentOverlay"></div>
    </aside>

    <!-- Tempat Penampungan Modal Form Add/Edit Guide (Hanya Di-inject untuk ITAdmin) -->
    <div id="adminGuideModalHolder"></div>

    <script type="module" src="./js/guide.js"></script>
    <script type="module" src="./js/nav-auth.js"></script>
</body>
</html>
