<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuidePage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
    :root {
        --black : rgb(0, 0, 0);
        --white : rgb(255, 255, 255);
        --snowwhite : rgb(251, 251, 251);
        --lightgrey : rgb(200, 206, 214);
        --grey : rgb(108, 117, 125);
        --darkgrey : rgb(71, 85, 105);
        --blue : rgb(0, 123, 255);
        --bg : rgb(248, 249, 250);
    }
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {display: flex; flex-direction: column; min-height: 100vh; font-family: Arial, sans-serif;overflow-y: auto; overflow-behavior: none; background-color: var(--bg);}

    nav {display: flex; flex-direction: row; justify-content: flex-end; align-items: center; width: 100%; min-height: 45px; border-bottom: 2px solid var(--lightgrey); background-color: var(--white); padding: 0px 13px; position:sticky; top: 0;}
    nav .nav_profile {display: flex; flex-direction: row; justify-content: space-around; gap: 10px;}
    nav .nav_profile li {list-style: none;}
    nav .nav_profile li a i{text-decoration: none;}

    main {
    display: flex; 
    flex-direction: column; 
    background-color: var(--snowwhite);
    flex: 1;
    /* Removed overflow-y: scroll to eliminate double scrollbars */
    }

    .guide-container { 
    display: flex; 
    flex-direction: column; 
    margin: 0 100px; 
    min-height: 100vh; 
    background-color: var(--white);
    }

    .container .guide-title {
    display: flex; 
    align-items: center; 
    color: var(--white); 
    background-color: var(--blue); 
    padding: 15px 50px;
    }

    .container .split { 
    display: grid; 
    grid-template-columns: 8.4fr 1.6fr; 
    width: 100%; 
    flex: 1; /* Automatically takes remaining space without adding extra 100vh */
    }

    .container .split .left { 
    display: flex; 
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-width: 0; 
    border-right: 2px solid var(--black); 
    background-color: var(--lightgrey);
    }

    .container .split .left .guide-video video { 
    width: 100%;
    }

    .container .split .right { 
    display: flex; 
    flex-direction: column;  
    width: 100%; 
    gap: 20px; 
    background-color: var(--snowwhite); 
    list-style: inside; 
    padding: 1rem; /* Consolidated duplicate padding declarations */
    min-height: 0; /* Allows nested content with overflow-y to scroll properly */
    }

    .container .split .right .guide-note {
    border-bottom: 2px solid var(--black);
    border-top: 2px solid var(--black);
    padding: 10px 0;
    }
</style>
</head>

<body>
    <nav>
        <ul class="nav_profile">
            <li>
                <a href="index.html">
                    <i class="fa-regular fa-circle-question"></i>
                </a>
            </li>
            <li>
                <a href="add-guide.html" title="Add New Guide">
                    <i class="fa-solid fa-plus"></i>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-clipboard-list"></i>
                </a>
            </li>
            <li>
                <a href="#" id="navUser">
                    <i class="fa-regular fa-circle-user"></i>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-maximize"></i>
                </a>
            </li>
        </ul>
    </nav>
    <main id="guide-container">

    </main>
    <script type="module" src="./js/guide.js"></script>
    <script type="module" src="./js/nav-auth.js"></script>
</body>
</html>
