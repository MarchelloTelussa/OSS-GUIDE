<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS-Guide</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
    :root {
        --black : rgb(0, 0, 0);
        --white : rgb(255, 255, 255);
        --lightgrey : rgb(200, 206, 214);
        --grey : rgb(108, 117, 125);
        --darkgrey : rgb(71, 85, 105);
        --blue : rgb(0, 123, 255);
        --bg : rgb(248, 249, 250);
    }
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {display: flex; flex-direction: column; min-height: 100vh; font-family: Arial, sans-serif;overflow-y: auto; overflow-behavior: none; background-color: var(--bg);}

    nav {display: flex; flex-direction: row; justify-content: flex-end; align-items: center; width: 100%; min-height: 45px; border-bottom: 2px solid var(--lightgrey); background-color: var(--white); padding: 0px 13px; position:sticky; top: 0;}
    nav .nav_profile {display: flex; flex-direction: row; justify-content: space-around; gap: 10px;}
    nav .nav_profile li {list-style: none;}
    nav .nav_profile li a i{text-decoration: none;}

    main {display: flex; flex-direction: column; align-content: stretch; flex: 1; overflow-y: scroll;}

    main .container_search {display: flex; flex-direction: row; justify-content: space-around; align-items: center; padding: 2rem 1rem; gap: 1rem; background-color: var(--blue); border-radius: 0 0 3% 3%;}

    .header_search {font-size: 2rem; color: var(--white);}

    .input_search {display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; min-height: 48px; padding: 16px 32px; border-radius: 50px; background-color: white; box-sizing: border-box;}
    .input_search input {flex: 1; border: none; outline: none; font-size: 1.2rem; background: transparent;}
    .error-state::placeholder {color: red;}

    .input_search button {width: 7%; border: none; background-color: transparent; font-size: 1.8rem;}
    .input_search button:hover {cursor: pointer; color: var(--blue)}

    .container_guide {display: flex; flex-direction: column; margin: 35px 50px; gap: 10px; font-size: 1rem; border: 2px solid var(--black); background-color: red;}
    .container_type {display: flex; flex-direction: row; align-items: center; justify-content: space-between; background-color: rgb(226, 179, 255, 1); padding: 0 1rem;}
    .container_bttn {display: flex; flex-direction: row;}
    
    .button_type {padding: 0.4rem 1.5rem ;border: 2px dotted var(--black); background: none;}
    .button_type:hover {background-color: rgba(158, 0, 254, 0.6);}
    .button_add {}

    .card_popular {display: flex; flex-direction: column; align-items: center;  gap: 20px;}
    .card_popular .guide_popular {display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 64px; padding: 1.25rem 1rem; text-decoration: none; border-radius: 15px; color: var(--black); border: 1px solid var(--black); background-color: var(--white); box-sizing: border-box;} main .card_popular .guide_popular h2 {margin: 0; font-size: 1.5rem;}
    .card_popular .guide_popular p {margin: 5px 0 0 0; color: var(--grey); font-size: 1rem;}
    .card_popular .guide_popular:hover {padding: 30px 25px; box-shadow: 5px 10px 5px #888888; transition: 0.2s ease-in-out; }

</style>
</head>
<body>
    <nav>
        <ul class="nav_profile">
            <li>
                <a href="index.html">
                    <i class="fa-regular fa-circle-question"></i>
                </a>
            </li>
            <li>
                <a href="add-guide.html" title="Add New Guide">
                    <i class="fa-solid fa-plus"></i>
                </a>
            </li>
            <li>
                <a href="#" id="navUser">
                    <i class="fa-regular fa-circle-user"></i>
                </a>
            </li>
            <li>
                <a href="#" id="fullscreenBtn">
                    <i class="fa-solid fa-maximize"></i>
                </a>
            </li>
        </ul>
    </nav>
    <main>
        <div class="container_search">
            <div class="header_search">
                <h1> Dashboard </h1>
            </div>
            <div class="input_search">
                <input id="main_search_bar" type="text">
                <button id="main_search_button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
        <div class="container_guide">
            <div class="container_type">
                <div  id ="contTypes" class="container_bttn">

                </div>
            <div id="bttnAdd" class="button_add">
                <button>add</button>
            </div>
            </div>
            <div id="cardGuide" class="card_popular">

            </div>
        </div>
    </main>
    <footer>

    </footer>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/nav-auth.js"></script>
</body>
</html>
