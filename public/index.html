<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS-Guide</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --outline : rgb(200, 206, 214);
            --text1 : rgb(71, 85, 105);
            --text2 : rgb(108, 117, 125);
            --main : rgb(5, 3, 102);
            --second : rgb(3, 0, 151);
            --second2 : rgb(250, 250, 250); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Arimo";}
        html, body { height: 100vh; margin: 0; overflow: hidden; }
        .fa, .fas, .far, .fab { border-radius: 0px !important; }
        .navContainer {top: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 100%; padding: 0 1rem; min-height: 2.75rem;background-color: var(--main);}
        .appName {color: white; font-weight: bold; font-size: 1.2rem;}
        .navAction {list-style-type: none; list-style: none; margin: 0; padding: 0; display: flex; gap: 0.8rem;}
        .navAction a {text-decoration: none; color: white; font-size: 1.2rem; font-weight: 500;}

        header {display: flex; flex-direction: row; align-items: flex-end; margin: 1.5rem 5rem 0; width: 100%; max-height: 5rem;}
        .logoHeader { width: 3.5rem; height: 3.5rem; flex-shrink: 0; object-fit: contain;}
        .pageName {color: var(--main); font-size: 4rem; margin: 0 0 -0.75rem 0.5rem; padding: 0;}
        .searchContainer {display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; max-width: 40rem; height: 100%; max-height: 3rem; padding: 1rem 1rem; border-radius: 10px; border: 1px solid black; box-sizing: border-box; margin: 0 0 0 2.5rem}
        .searchContainer input {flex: 1; border: none; outline: none; font-size: 1.2rem; background: transparent; width: 100%;}
        .searchContainer button {width: auto; border: none; background-color: transparent; font-size: 2rem;}
        .searchContainer button:hover {cursor: pointer; color: var(--second);}

        main {height: calc(100vh - 9.5rem); overflow: hidden; margin: 0.25rem 5rem 0; border: 1px solid black;}
        .content {display: flex; flex-direction: column; height: 100%;}
        .typeContainer {display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 2rem 0 0; width: 100%; height: 2.5rem; background-color: var(--main);}
        .typeGroup {display:flex; flex-direction: row; width: auto; height: 100%;}
        .typeButton {display: flex; align-items: center; justify-content: center; padding: 0 1rem; height: 100%; cursor: pointer; transition: background-color 0.2s;}
        .typeButton:hover, .typeButton.active {background-color: var(--second);}
        .typeButton h1 {color: white; font-size: 1rem; font-weight: 600; white-space: nowrap;}
        
        .typeManageButton button {color: white; background: none; border: none; cursor: pointer; font-size: 1.25rem;}

        .identityContainer {display: flex; flex-direction: row; width: 100%; height: calc(100% - 2.5rem); gap: 20px;}

        .typeIdentity { display: flex; flex-direction: column; width: 75%; height: 100%; padding: 1rem 2rem; background-color: var(--second2); overflow-y: auto; }
        .typeIdentity.is-vertical { flex-direction: row; align-items: flex-start; gap: 2rem; }
        .typeIdentity.is-vertical .typeDescription { width: 50%; }
        .typeIdentity.is-vertical .typeImage { width: 50%; max-height: 80vh; }
        .typeIdentity.is-vertical .typeImage img { width: auto; max-height: 75vh; object-fit: contain; }

        .typeDescription { width: 100%; flex-shrink: 0; margin-bottom: 1rem; }
        .typeDescription h1 { font-size: 2.5rem; margin: 0 0 0.5rem 0; text-transform: uppercase; color: var(--main); }
        .typeDescription p { font-weight: bold; font-size: 1rem; text-align: justify; color: var(--text1); }
        
        .typeImage { display: flex; flex-direction: column; width: 100%; flex: 1; min-height: 0; overflow: hidden; }
        .typeImage img { width: 100%; height: 100%; object-fit: contain; object-position: top left; }

        .guideGroupContainer {width: 25%; padding: 1rem; background-color: var(--second2); overflow-y: auto;}
        .guideHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .guideHeader h1 { font-size: 2.5rem; margin: 0; color: var(--main); }
        .btnManageGroup { background: none; border: none; color: var(--main); cursor: pointer; font-size: 1.2rem; }
        .btnManageGroup:hover { color: var(--second); }

        .guideGroup {display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; min-height: 3rem; border: 1px solid var(--outline); border-radius: 6px; padding: 0.5rem 1rem; margin-bottom: 0.5rem; cursor: pointer; background-color: white;}
        .guideGroup:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); }
        .guideGroup h1 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--text1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal Base Styles */
        .backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); opacity: 0; visibility: hidden; transition: opacity 0.3s; z-index: 90; }
        .backdrop.active { opacity: 1; visibility: visible; }

        .typeModal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 90%; max-width: 650px; background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .typeModal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .typeModalHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; position: relative; }
        .typeModalHeader h2 { color: var(--main); font-size: 2rem; width: 100%; text-align: center; }
        .typeModalHeader .closeModalBtn { background: none; border: none; font-size: 1.8rem; cursor: pointer; color: black; position: absolute; top: -0.5rem; right: 0; }
        .addTypeForm { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background-color: var(--main); padding: 0.4rem; border-radius: 6px; }
        .addTypeForm input { flex: 1; padding: 0.6rem 1rem; font-size: 1.1rem; border: none; outline: none; border-radius: 4px; }
        .addTypeForm button { background: transparent; color: white; border: none; font-size: 1.5rem; padding: 0 1rem; cursor: pointer; }
        .typeListManage { display: flex; flex-direction: column; gap: 0.6rem; max-height: 320px; overflow-y: auto; }
        .manageTypeItem { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .manageTypeTitle { flex: 1; background-color: var(--main); color: white; padding: 0.75rem 1rem; font-weight: bold; text-align: center; font-size: 1.1rem; border-radius: 4px; text-transform: uppercase; }
        .manageTypeActions { display: flex; gap: 0.25rem; }
        .manageTypeActions button { background-color: var(--main); color: white; border: none; padding: 0.75rem 0.9rem; font-size: 1.1rem; cursor: pointer; border-radius: 4px; }
        .editTypeForm { display: flex; flex-direction: column; gap: 1rem; }
        .editTypeForm label { font-weight: bold; color: var(--main); margin-bottom: 0.2rem; display: block; }
        .editTypeForm input, .editTypeForm textarea { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--outline); border-radius: 6px; font-size: 1rem; }
        .editTypeForm button.btnSave { background-color: var(--main); color: white; border: none; padding: 0.8rem; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; }

        @media screen and (max-width: 1200px) { header { margin: 1.25rem 2rem 0; } main { margin: 0.25rem 2rem 0; } }
        @media screen and (max-width: 992px) { .pageName { font-size: 3rem; margin: 0 0 -0.5rem 0.5rem; } .searchContainer { max-width: 100%; margin-left: 0; } .identityContainer { flex-direction: column; height: auto; overflow-y: auto; } .typeIdentity { width: 100%; height: auto; } .guideGroupContainer { width: 100%; height: auto; } }
        @media screen and (max-width: 768px) { html, body { overflow-y: auto; } header { flex-direction: column; align-items: flex-start; max-height: none; margin: 1rem; width: calc(100% - 2rem); gap: 0.75rem; } header > div:first-child, header { display: flex; flex-wrap: wrap; } .logoHeader { width: 3rem; height: 3rem; } .pageName { font-size: 2.25rem; margin: 0 0 0 0.5rem; } .searchContainer { width: 100%; max-width: 100%; margin: 0; height: 3rem; box-sizing: border-box; } main { height: auto; margin: 0.5rem 1rem 1rem; overflow: visible; } .typeContainer { padding: 0 0.5rem; height: auto; min-height: 2.75rem; flex-direction: row; align-items: center; justify-content: space-between; gap: 0.5rem; } .typeGroup { flex: 1; overflow-x: auto; white-space: nowrap; display: flex; -webkit-overflow-scrolling: touch; } .typeButton { flex-shrink: 0; } .typeManageButton { flex-shrink: 0; } .typeModal { width: 95%; padding: 1.5rem 1rem; } }
        @media screen and (max-width: 480px) { .appName { font-size: 1rem; } .navAction { gap: 0.5rem; } .typeIdentity { padding: 1rem; } .typeDescription h1 { font-size: 1.8rem; } .guideHeader h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>
    <nav class="navContainer">
        <div class="appName">
            <h3>QUANTUM GUIDE</h3>
        </div>
        <ul class="navAction">
            <li><a href="index.html"><i class="fa-regular fa-circle-question"></i></a></li>
            <li><a href="#" id="user"><i class="fa-regular fa-circle-user"></i></a></li>
            <li><a href="#" id="fullscreen"><i class="fa-solid fa-maximize"></i></a></li>
        </ul>
    </nav>
    <header>
        <img class="logoHeader" src="./img/logo.png" alt="Logo">
        <h1 class="pageName">DASHBOARD</h1>
        <div class="searchContainer">
            <input id="searchBar" type="text" placeholder="Cari guide...">
            <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>
    <main>
        <div class="content">
            <div class="typeContainer">
                <div id="types" class="typeGroup"></div>
                <!-- Tombol Manage Type akan di-inject lewat JS khusus jika user == ITAdmin -->
                <div id="typeManageContainer" class="typeManageButton"></div>
            </div>
            <div class="identityContainer">
                <div class="typeIdentity">
                    <div class="typeDescription">
                        <span id="typeName" class="name"><h1>OSS WEB</h1></span>
                        <span id="typeDesc" class="description"><p>Loading details...</p></span>
                    </div>
                    <div class="typeImage"></div>
                </div>
                <div id="guideGroup" class="guideGroupContainer"></div>
            </div>
        </div>
    </main>

    <!-- TempatPenampungan Modal Admin (Kosong secara default) -->
    <div id="adminModalHolder"></div>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/nav-auth.js"></script>
</body>
</html>
