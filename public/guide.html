<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
    :root {
        --black : rgb(0, 0, 0);
        --white : rgb(255, 255, 255);
        --snowwhite : rgb(251, 251, 251);
        --lightgrey : rgb(200, 206, 214);
        --grey : rgb(108, 117, 125);
        --darkgrey : rgb(71, 85, 105);
        --blue : rgb(13, 110, 253);
        --red : rgb(220, 53, 69);
        --green : rgb(74, 222, 128);
        --bg : rgb(248, 249, 250);
    }
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {display: flex; flex-direction: column; min-height: 100vh; font-family: Arial, sans-serif;overflow-y: auto; overflow-behavior: none; background-color: var(--bg);}

    nav {display: flex; flex-direction: row; justify-content: flex-end; align-items: center; width: 100%; min-height: 45px; border-bottom: 2px solid var(--lightgrey); background-color: var(--white); padding: 0px 13px; position:sticky; top: 0;}
    nav .nav_profile {display: flex; flex-direction: row; justify-content: space-around; gap: 10px;}
    nav .nav_profile li {list-style: none;}
    nav .nav_profile li a i{text-decoration: none;}

    main {display: flex; flex-direction: column; align-content: stretch; flex: 1; overflow-y: scroll; background-color: var(--snowwhite);}

    .container { display: flex; flex-direction: column; margin: 0 100px; min-height: 100vh; background-color: var(--white);}
    .container .guide-title {display: flex; align-items: center; color: var(--white); background-color: var(--black); padding: 15px 50px ;}
        
    .container .split { display: grid; grid-template-columns: 6.5fr 3.5fr; gap: 24px; width: 100%; flex: 1; min-height: 100vh;}

    .container .split .left { display: flex; flex-direction: column; align-items: end; min-width: 0; height: 100%; padding-right: 5px; border-right: 2px solid #e0e0e0; gap: 10px; align-items: center;}
    .container .split .right { display: flex; flex-direction:column; align-items: center; height: 100%; width: 100%; box-sizing: border-box; gap: 10px;}
    
    .container .split .left .guide-video video { width: 100%; height: auto;}
    .container .split .left .guide-desc {}
</style>
</head>

<body>
    <nav>
        <ul class="nav_profile">
            <li>
                <a href="index.html">
                    <i class="fa-regular fa-circle-question"></i>   
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-clipboard-list"></i>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-regular fa-circle-user">ADMIN</i>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-maximize"></i>
                </a>
            </li>
        </ul>
    </nav>
    <main>
        <div id="guide-container">
            
        </div>
    </main>
    <script type="module" src="./js/guide.js"></script>
</body>
</html>
