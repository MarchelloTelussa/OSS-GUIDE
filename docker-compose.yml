services:
  web:
    build: .
    ports:
      - "3000:3000"       # Port web standar production
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}   # Membaca password dari file .env
      - DB_NAME=quantumguide
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Membaca password dari file .env
      POSTGRES_DB: quantumguide
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=quantumguide"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql
      - ./Essential/quantumguide.sql:/docker-entrypoint-initdb.d/02-quantumguide.sql
    ports:
      - "127.0.0.1:5432:5432"  # Hanya mengizinkan akses DB dari internal server (Aman!)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantumguide"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: